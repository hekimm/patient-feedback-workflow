name: dotnet

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore HastaGeriBildirim.sln

      - name: Build
        run: dotnet build HastaGeriBildirim.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HastaGeriBildirim.sln --configuration Release --no-build --verbosity normal
